name: Daily content pipeline

# Runs the trend scout and article builder every morning, then commits
# refreshed data/*.json back to the repo. No API keys, no secrets.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scout trends
        run: python3 scout.py

      - name: Draft from briefs (optional AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 draft.py

      - name: Build articles data
        run: python3 build.py

      - name: Commit if changed
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add data/articles.json data/trends.json
          for f in data/briefs.json data/drafts.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "Daily pipeline: $(date -u +%Y-%m-%d)"
          git push
